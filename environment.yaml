name: trolr-env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Core tools
  - python=3.8
  - r-base>=4.0
  
  # Bioinformatics tools
  - bedtools=2.31.1
  - samtools=1.22
  - bioconda::vamos=2.1.7
  
  # Python packages
  - pandas>=1.3.0
  - numpy>=1.21.0
  - pysam>=0.19.0
  - scipy>=1.7.0
  - matplotlib>=3.4.0
  
  # R packages
  - r-data.table
  - r-dt
  - r-rmarkdown
  - r-knitr
  - r-digest
  - r-htmltools
  - r-tidyverse
  - r-r.utils
  
  # Development tools
  - pip
  - pytest
  - black
  - flake8